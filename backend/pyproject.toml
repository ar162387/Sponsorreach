[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sponsor-match"
version = "0.1.0"
description = "Evidence-based sponsor employer discovery"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "psycopg[binary,pool]==3.3.6", "httpx==0.28.1", "pydantic==2.14.1", "beautifulsoup4==4.15.0", "openpyxl==3.1.5"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
rerank = ["sentence-transformers==6.1.0"]
local = ["sentence-transformers==6.1.0"]

[project.scripts]
sponsormatch = "sponsor_match.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

